<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Game</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="speed"><span id="speed-value">0</span><span class="unit">km/h</span></div>
      <div id="gear">D</div>
    </div>
    <div id="help">
      <div class="map"><span id="map-name"></span>・<span id="mode-name"></span>・<span id="car-name"></span></div>
      <div class="manual-only"><kbd>W</kbd>/<kbd>↑</kbd> アクセル　<kbd>S</kbd>/<kbd>↓</kbd> ブレーキ・後退</div>
      <div class="manual-only"><kbd>A</kbd><kbd>D</kbd>/<kbd>←</kbd><kbd>→</kbd> ハンドル</div>
      <div class="assist-only"><kbd>1</kbd>〜<kbd>0</kbd> 指示　<kbd>V</kbd> 音声で指示　<kbd>K</kbd> 運転のうまさ</div>
      <div><kbd>Q</kbd> モード切替（自分で運転／ハルに指示）</div>
      <div><kbd>C</kbd> カメラ切替 <span id="camera-name"></span></div>
      <div><kbd>N</kbd> マップ切替　<kbd>P</kbd> 車の切替　<kbd>R</kbd> リセット</div>
      <div><kbd>M</kbd> サウンド <span id="sound-state"></span>　<kbd>H</kbd> ヘルプ表示</div>
      <div id="gamepad-state" class="hidden">🎮 ゲームパッド: 左スティック / RT / LT・Y カメラ・START リセット・BACK マップ</div>
    </div>
    <div id="assist" class="hidden">
      <div id="heard"></div>
      <div id="subtitle"><span id="subtitle-name"></span><span id="subtitle-text"></span></div>
      <div id="commands"></div>
      <div id="assist-bar">
        <button id="mic"></button>
        <span id="assist-status"></span>
      </div>
    </div>
    <div id="toast"></div>
    <div id="loading">Loading...</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
